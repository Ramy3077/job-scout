<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Scout</title>
<meta name="description" content="job-scout: a local job tracker that builds a CV tailored to each posting, and never invents a line.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Familjen+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231D4A35'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23EFB32D'/%3E%3C/svg%3E">
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>

<header class="mast">
  <div class="mast-in">
    <div class="mast-meta">
      <span id="m-season">Season</span>
      <span class="sep">◆</span>
      <span id="m-week">Matchweek</span>
      <span class="sep">◆</span>
      <span id="m-date"></span>
    </div>
    <h1 class="title"><span class="t1">The</span> <span class="t2">Scout</span></h1>
    <div class="mast-side">
      <div class="mast-tag">job-scout</div>
      <div class="scan-note" id="scan-note"></div>
    </div>
  </div>
  <div class="stripe"></div>
</header>

<div class="ticker" aria-label="Latest">
  <div class="ticker-label">Latest</div>
  <div class="ticker-track"><div class="ticker-run" id="ticker"></div></div>
</div>

<nav class="tabs" role="tablist">
  <button class="tab on" data-tab="matchday" role="tab">Matchday</button>
  <button class="tab" data-tab="scouting" role="tab">Scouting</button>
  <button class="tab" data-tab="season" role="tab">Season</button>
</nav>

<main>
  <!-- MATCHDAY -->
  <section class="panel on" id="p-matchday">
    <div class="hero">
      <div class="score-card rise">
        <div class="kicker">This week</div>
        <div class="bigscore"><span id="sent-n">0</span><span class="of">/<span id="target-n">5</span></span></div>
        <div class="balls" id="balls"></div>
        <p class="hero-line" id="hero-line"></p>
      </div>
      <div class="form-card rise" style="--d:.08s">
        <div class="kicker">Form <span class="kick-sub" id="form-sub">last 8 weeks</span></div>
        <div class="form" id="form"></div>
        <p class="hero-line" id="streak-line"></p>
      </div>
    </div>

    <div class="block">
      <h2 class="h2"><span>Fixtures</span><em id="fx-sub">this week's applications</em>
        <button class="btn btn-ghost sm" id="sign-toggle">+ Pick your own</button></h2>
      <div class="sign" id="sign" hidden>
        <div class="sign-in">
          <input id="sq" type="search" placeholder="Search every tracked role" autocomplete="off" aria-label="Search tracked roles">
          <div id="sq-hits" class="hits"></div>
          <div class="sign-or">or add one the scout never saw</div>
          <div class="sign-row">
            <input id="n-co" placeholder="Company" aria-label="Company">
            <input id="n-ti" placeholder="Role" aria-label="Role">
          </div>
          <div class="sign-row">
            <input id="n-url" placeholder="Link (optional)" aria-label="Link">
            <input id="n-dl" type="date" title="Closing date (optional)" aria-label="Closing date">
            <button class="btn btn-claret" id="n-add">Add</button>
          </div>
          <div class="flash" id="sign-msg"></div>
        </div>
      </div>
      <div id="fixtures"></div>
      <p class="bench" id="bench"></p>
    </div>

    <div class="block">
      <h2 class="h2"><span>Awaiting results</span><em id="wait-sub">applications out</em></h2>
      <ol class="table" id="waiting"></ol>
    </div>
  </section>

  <!-- SCOUTING -->
  <section class="panel" id="p-scouting">
    <div class="scout-bar">
      <div class="seg" id="seg">
        <button data-view="open" class="on">Open market</button>
        <button data-view="sent">Sent</button>
        <button data-view="out">Out</button>
        <button data-view="shelved">Shelved</button>
        <button data-view="all">Everything</button>
      </div>
      <input id="rq" type="search" placeholder="Filter by company or role" autocomplete="off" aria-label="Filter roles">
    </div>
    <p class="scout-count" id="scout-count"></p>
    <div id="market" class="market"></div>
  </section>

  <!-- SEASON -->
  <section class="panel" id="p-season">
    <div class="sheet">
      <div class="stats" id="stats"></div>
      <div class="block">
        <h2 class="h2"><span>Sent per week</span><em>the dashed line is the target</em></h2>
        <div class="chart" id="chart"></div>
      </div>
      <div class="block">
        <h2 class="h2"><span>How far they got</span><em>every application this season</em></h2>
        <div class="funnel" id="funnel"></div>
      </div>
    </div>
  </section>
</main>

<footer class="foot" id="foot"></footer>
<div class="toast" id="toast" role="status"></div>

<template id="stamp"><div class="stamp">Sent</div></template>
<script src="/app.js"></script>
</body>
</html>
